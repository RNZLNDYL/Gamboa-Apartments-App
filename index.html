<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paupahan rent tracker</title>
<script>try{var t=localStorage.getItem('paupahan-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#19353F; --muted:#557079; --line:#D5E0DD;
  --primary:#ABE659; --primary-ink:#19353F; --primary-soft:#E7F6D0; --focus:#19353F;
  --header-bg:#19353F; --header-ink:#FFFFFF; --header-muted:#A9C0C6;
  --chart-a:#19353F;
  --paid:#2E7D4A; --paid-bg:#E2F3DF;
  --soon:#9A6510; --soon-bg:#FCEFD3;
  --over:#B33A2A; --over-bg:#FBE3DE;
  --daily:#2B67A0; --daily-bg:#E1ECF8;
  --shadow:0 1px 0 rgba(25,53,63,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E2027; --surface:#163039; --ink:#E6F0EE; --muted:#93AEB4; --line:#284650;
    --primary:#ABE659; --primary-ink:#19353F; --primary-soft:#24402A; --focus:#ABE659;
    --header-bg:#0A181D; --header-ink:#E6F0EE; --header-muted:#8FA9AF;
    --chart-a:#ABE659;
    --paid:#7FD39B; --paid-bg:#183A2C;
    --soon:#E6B45E; --soon-bg:#372B14;
    --over:#F07F6E; --over-bg:#3B1D19;
    --daily:#79ADE0; --daily-bg:#162A3D;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E2027; --surface:#163039; --ink:#E6F0EE; --muted:#93AEB4; --line:#284650;
  --primary:#ABE659; --primary-ink:#19353F; --primary-soft:#24402A; --focus:#ABE659;
  --header-bg:#0A181D; --header-ink:#E6F0EE; --header-muted:#8FA9AF;
  --chart-a:#ABE659;
  --paid:#7FD39B; --paid-bg:#183A2C;
  --soon:#E6B45E; --soon-bg:#372B14;
  --over:#F07F6E; --over-bg:#3B1D19;
  --daily:#79ADE0; --daily-bg:#162A3D;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.55 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--header-bg)}
h1,h2,h3{font-family:"Bricolage Grotesque",Manrope,system-ui,sans-serif;font-weight:750;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.top :focus-visible{outline-color:var(--primary)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--header-bg);color:var(--header-ink)}
.bar{max-width:1040px;margin:0 auto;padding:14px 20px 6px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;flex:none;display:block}
.logo .h{fill:var(--primary);stroke:var(--primary);stroke-width:1.5;stroke-linejoin:round}
.brand-text{min-width:0}
.brand h1{font-size:1.35rem;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;color:var(--header-muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-right{display:flex;align-items:center;gap:12px;flex:none}
.save{font-size:.8rem;color:var(--header-muted);text-align:right}
.theme-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--header-ink);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem;cursor:pointer}
.theme-btn:hover{border-color:var(--primary);color:var(--primary)}
.theme-btn svg{width:16px;height:16px;flex:none}
.tabs{max-width:1040px;margin:0 auto;padding:0 12px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs a{display:flex;align-items:center;gap:6px;padding:10px 10px 12px;color:var(--header-muted);text-decoration:none;font-weight:600;font-size:.95rem;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a svg{display:none;width:22px;height:22px}
.tabs a:hover{color:var(--header-ink)}
.tabs a[aria-current="page"]{color:var(--header-ink);border-color:var(--primary)}

main{max-width:1040px;margin:0 auto;padding:24px 20px 64px}
.section-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 16px}
.section-head h2{font-size:1.6rem}
.lede{color:var(--muted);margin:4px 0 0;max-width:62ch}
.lede strong{color:var(--ink)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.small{padding:6px 10px;font-size:.85rem;border-radius:8px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{color:var(--ink)}
.btn.danger{color:var(--over)}
.row-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.progress{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:14px 0 6px;max-width:520px}
.progress span{display:block;height:100%;background:var(--paid);border-radius:inherit}
.progress-label{font-size:.85rem;color:var(--muted);margin:0}

/* Building board */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;margin:20px 0 10px}
.door{position:relative;text-align:left;cursor:pointer;min-height:132px;padding:14px 12px 12px;border-radius:30px 30px 8px 8px;border:2px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:flex-end;gap:2px;box-shadow:var(--shadow);transition:transform .12s ease}
.door:hover{transform:translateY(-2px)}
.door::after{content:"";position:absolute;right:14px;top:58px;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.door .num{font-family:"Bricolage Grotesque",Manrope,sans-serif;font-weight:750;font-size:1.3rem;line-height:1.1;color:var(--ink)}
.door .who{font-size:.85rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.door .st{font-size:.8rem;font-weight:700}
.door.paid{border-color:var(--paid);background:var(--paid-bg);color:var(--paid)}
.door.soon{border-color:var(--soon);background:var(--soon-bg);color:var(--soon)}
.door.over{border-color:var(--over);background:var(--over-bg);color:var(--over)}
.door.daily{border-color:var(--daily);background:var(--daily-bg);color:var(--daily)}
.door.upcoming{color:var(--muted)}
.door.vacant{border-style:dashed;background:transparent;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted);margin-bottom:28px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:5px 5px 2px 2px;margin-right:6px;vertical-align:-1px;border:2px solid var(--c)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1 1 220px;min-width:0}
.title{font-weight:700}
.sub{color:var(--muted);font-size:.88rem}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--primary-soft);color:var(--ink)}
.pill.over{background:var(--over-bg);color:var(--over)}
.pill.soon{background:var(--soon-bg);color:var(--soon)}
.pill.paid{background:var(--paid-bg);color:var(--paid)}
.pill.daily{background:var(--daily-bg);color:var(--daily)}
.pill.upcoming{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
h3.group{font-size:1.1rem;margin:28px 0 10px}
a.inline{color:var(--ink);font-weight:700}

.empty{border:2px dashed var(--line);border-radius:16px;padding:32px 24px;text-align:center}
.empty h2{font-size:1.5rem;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 auto 18px;max-width:46ch}
.empty .row-actions{justify-content:center}
.callout{background:var(--soon-bg);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}

.inline-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;font-weight:500;font-size:max(16px,1rem);color:var(--ink);min-width:0;width:100%}
input[type=radio]{width:auto}
textarea{resize:vertical}
.grow{flex:1 1 220px}
.backup-box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
label.filebtn{display:inline-flex;flex-direction:row;align-items:center;color:var(--ink);font-size:.85rem;cursor:pointer;position:relative}
label.filebtn:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.danger-zone{border:1px solid var(--over);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:8px}
.danger-zone .title{color:var(--over)}
.month-pick{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.month-pick label{flex:1 1 170px;min-width:0}
.month-pick .btn{flex:none;min-height:42px}
input[type=month],input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:42px;max-width:100%}
input::-webkit-date-and-time-value{text-align:left}

/* Meter readings */
.meters{display:grid;gap:12px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.meter.vacant{opacity:.75}
.meter-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.meter-grid{display:grid;grid-template-columns:120px 1fr 1fr 1.2fr;gap:8px 10px;align-items:center}
.meter-grid .col{font-size:.75rem;color:var(--muted);font-weight:600}
.mlabel{font-weight:700;font-size:.9rem}
.mres{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mres strong{color:var(--ink)}
.meter .row-actions{margin-top:12px}
.meter input{padding:8px 10px;font-variant-numeric:tabular-nums}

/* Reports */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:12px;font-family:Manrope,system-ui,sans-serif}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .c-a{fill:var(--chart-a)}
.chart .c-d{fill:var(--daily)}
.chart .exp{stroke:var(--ink);stroke-width:2;stroke-dasharray:4 3}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.82rem;color:var(--muted);margin-top:8px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.prev{border-collapse:collapse;width:100%;font-size:.88rem}
.prev th,.prev td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.prev th{border-top:0;color:var(--muted);font-weight:600}
.prev td.num,.prev th.num{text-align:right}
.mbar{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;margin:8px 0;font-size:.9rem}
.mbar .track{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.mbar .track i{display:block;height:100%;background:var(--chart-a);border-radius:inherit}

dialog{border:0;border-radius:18px;padding:0;width:min(480px,calc(100vw - 24px));max-height:calc(var(--vvh,100dvh) - 24px);overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog.wide{width:min(760px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,24,29,.5)}
html.modal-open,html.modal-open body{overflow:hidden;overscroll-behavior:none}
.dlg{padding:22px 22px 18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-size:1.35rem}
.dlg .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.dlg .note{color:var(--muted);font-size:.88rem;margin:0}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{flex:1;flex-direction:row;justify-content:center;align-items:center;padding:8px;cursor:pointer;color:var(--ink);gap:6px}
input[type=file]{padding:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.toast{display:flex;align-items:center;gap:16px}
.toast.has-action{pointer-events:auto}
.toast-btn{background:none;border:0;color:inherit;font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:4px 2px;cursor:pointer}
[hidden]{display:none!important}
body.gated .tabs,body.maint .tabs{display:none!important}
@media (max-width:640px){body.gated main,body.maint main{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}}
.gate{max-width:560px;margin:8px auto 0;display:grid;gap:16px}
.gate h2{font-size:1.7rem}
.gate .card{display:grid;gap:10px}
.gate .card h3{font-size:1.1rem}
.gate-err{color:var(--over)}
.role-select{width:auto;padding:6px 8px}
.searchbar{margin:18px 0 0}
.searchbar input{max-width:420px;background:var(--surface)}
.nomatch{margin-top:16px}
.grp-head{font-size:1.05rem;margin:22px 0 10px;display:flex;align-items:baseline;gap:8px}
.grp-head span{font:600 .8rem Manrope,system-ui,sans-serif;color:var(--muted)}
.grp-head + .board{margin-top:0}

/* Phones: bottom navigation within thumb reach */
@media (max-width:640px){
  .bar{padding:12px 16px 12px}
  .theme-btn span{display:none}
  .save{max-width:92px;font-size:.7rem;line-height:1.25}
  .save.quiet{display:none}
  .brand h1{font-size:1.12rem;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:none;margin:0;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:var(--header-bg);justify-content:space-around;overflow:visible;border-top:1px solid rgba(255,255,255,.08)}
  .tabs a{flex:1;flex-direction:column;gap:3px;padding:4px 2px;font-size:.72rem;border-bottom:0}
  .tabs a svg{display:block;width:44px;height:28px;padding:3px 11px;border-radius:999px;box-sizing:border-box}
  .tabs a[aria-current="page"] svg{background:var(--primary);color:var(--primary-ink)}
  main{padding:20px 16px calc(104px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .board{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
  .door{min-height:116px}
  .dlg .two{grid-template-columns:1fr}
  .meter-grid{grid-template-columns:1fr 1fr}
  .meter-grid .mlabel,.meter-grid .mres{grid-column:1 / -1}
  .meter-grid .col.lead,.meter-grid .col.tail{display:none}
  .mbar{grid-template-columns:90px 1fr auto}
  .chart text{font-size:13px}
  .month-pick{display:grid;grid-template-columns:minmax(0,1fr) auto;width:100%}
  dialog{top:calc(var(--vvt,0px) + 12px);bottom:auto;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
        <rect class="h" x="26" y="7" width="4" height="8" rx="0.5"/>
        <path class="h" d="M20 5 L37 19 H32 V35 Q32 36 31 36 H9 Q8 36 8 35 V19 H3 Z"/>
      </svg>
      <div class="brand-text"><h1 id="appTitle">Paupahan</h1><p id="bizName">Your rentals</p></div>
    </div>
    <div class="hdr-right">
      <span id="saveState" class="save" role="status" aria-live="polite"></span>
      <button type="button" id="themeBtn" class="theme-btn"></button>
    </div>
  </div>
  <nav class="tabs" aria-label="Sections">
    <a href="#overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#units"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 21V6a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v15M3 21h18"/><circle cx="14.5" cy="12.5" r=".8" fill="currentColor"/></svg>Units</a>
    <a href="#bills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Bills</a>
    <a href="#payments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M15 15h3"/></svg>Payments</a>
    <a href="#reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 20V11M11 20V5M17 20v-6M2 20h20"/></svg>Reports</a>
  </nav>
</header>
<main id="app"></main>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toast" class="toast" role="status"></div>

<script type="module">

  authDomain: "gamboa-apartments.firebaseapp.com",
  projectId: "gamboa-apartments",
  storageBucket: "gamboa-apartments.firebasestorage.app",

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso = n => { const v = Number(n || 0); const f = Number.isInteger(Math.round(v * 100) / 100) ? 0 : 2; return '₱' + v.toLocaleString('en-PH', {minimumFractionDigits: f, maximumFractionDigits: 2}); };
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const parseD = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const round2 = n => Math.round(n * 100) / 100;
let today, TODAY, THIS_MONTH;
function setToday(){ const d = new Date(); d.setHours(0,0,0,0); today = d; TODAY = ymd(d); THIS_MONTH = mkey(d); }
setToday();
const monthOf = d => String(d || '').slice(0, 7);
const monthName = k => parseD(k + '-01').toLocaleDateString('en-PH', {month:'long', year:'numeric'});
const monthShort = k => parseD(k + '-01').toLocaleDateString('en-PH', {month:'short'});
const shortDate = d => (typeof d === 'string' ? parseD(d) : d).toLocaleDateString('en-PH', {month:'short', day:'numeric'});
const addMonths = (k, n) => { const d = parseD(k + '-01'); d.setMonth(d.getMonth() + n); return mkey(d); };
const monthEnd = k => { const d = parseD(k + '-01'); return ymd(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
const newId = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const sum = (arr, f) => arr.reduce((a, x) => a + Number(f(x) || 0), 0);
const METHODS = ['GCash', 'Maya', 'Bank transfer', 'Cash'];
const KEY = 'paupahan-book';
const VIEWS = ['overview', 'units', 'bills', 'payments', 'reports'];
const phoneQuery = window.matchMedia('(max-width: 640px)');

let book = blank();
let loadSlow = false;
let loaded = false;
let payMonth = THIS_MONTH, billMonth = THIS_MONTH;

function blank(){ return {business:'', elecRate:0, waterRate:0, lastBackup:'', reminderLang:'en', units:[], stays:[], payments:[], repairs:[], readings:[]}; }
function normalize(d){
  const c = JSON.parse(JSON.stringify(d || {}));
  const b = blank();
  b.business = typeof c.business === 'string' ? c.business : '';
  b.elecRate = Number(c.elecRate) || 0;
  b.waterRate = Number(c.waterRate) || 0;
  b.lastBackup = typeof c.lastBackup === 'string' ? c.lastBackup : '';
  b.reminderLang = c.reminderLang === 'tl' ? 'tl' : 'en';
  ['units','stays','payments','repairs','readings'].forEach(k => { b[k] = Array.isArray(c[k]) ? c[k].filter(o => o && typeof o === 'object' && !Array.isArray(o)) : []; });
  // IDs end up inside HTML attributes, so keep them to safe characters. The same cleaning is applied
  // to every reference (unitId, stayId), so links between records still match after cleaning.
  const cid = x => String(x ?? '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40);
  b.units.forEach(o => { o.id = cid(o.id); });
  b.stays.forEach(o => { o.id = cid(o.id); o.unitId = cid(o.unitId); });
  b.payments.forEach(o => { o.id = cid(o.id); o.stayId = cid(o.stayId); });
  b.repairs.forEach(o => { o.id = cid(o.id); o.unitId = cid(o.unitId); });
  b.readings.forEach(o => { o.id = cid(o.id); o.unitId = cid(o.unitId); });
  // Earlier versions had no payment history start. Count unpaid months only from when the stay was
  // first tracked, so a tenant added with an old move-in date isn't shown owing months never recorded.
  b.stays.forEach(o => { if (o.type === 'monthly' && !/^\d{4}-\d{2}$/.test(o.trackFrom || '')) o.trackFrom = monthOf(o.start) > THIS_MONTH ? monthOf(o.start) : THIS_MONTH; });
  return b;
}

/* ---------- saving ---------- */
let downloads = null, dlMode = 'anchor', timer = null;
function setSave(t){ const el = $('#saveState'); el.textContent = t; el.classList.toggle('quiet', /^(Saved|Saving…|Loading…|)$/.test(t)); }

/* ---------- Firebase: sign-in, roles, and live sync ----------
   Each unit, stay, payment, reading, and repair is its own Firestore document, so two people
   editing different records never overwrite each other. The rest of the app still edits the
   in-memory "book"; flush() compares it with what was last synced and writes only the differences. */
let FB = null, fbUser = null, bizId = '', role = '', gate = 'boot', gateMsg = '';
let unsubs = [], dataUnsubs = [], teamUnsubs = [], need = new Set(), ready = new Set();
let synced = {}, syncedBiz = '', pendingWrites = 0, pendingRender = false, teamOpen = false;
let team = {members:[], invites:[]};
const SYNC_COLS = ['units', 'stays', 'payments', 'readings', 'repairs'];
const SAFE_ID = /^[A-Za-z0-9_-]{1,40}$/;
const ROLE_NAMES = {owner:'Owner', manager:'Manager', maintenance:'Maintenance'};
const canManage = () => role === 'owner' || role === 'manager';
const colsFor = r => r === 'maintenance' ? ['units', 'repairs'] : SYNC_COLS;
const writableFor = r => r === 'maintenance' ? ['repairs'] : SYNC_COLS;
const cleanRef = v => String(v ?? '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40);

// Same data always produces the same text, whatever order its fields arrive in.
function stable(v){
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
const bizFromBook = () => ({name: book.business || '', elecRate: Number(book.elecRate) || 0, waterRate: Number(book.waterRate) || 0,
  reminderLang: book.reminderLang === 'tl' ? 'tl' : 'en', lastBackup: book.lastBackup || ''});

function commit(msg){
  render();
  if (msg) toast(msg);
  clearTimeout(timer);
  timer = setTimeout(flush, 400);
}
function showSaveState(){ setSave(!navigator.onLine ? 'Offline. Changes will sync' : pendingWrites ? 'Saving…' : 'Saved'); }
window.addEventListener('online', showSaveState);
window.addEventListener('offline', showSaveState);

function flush(){
  if (!FB || !bizId || !role) return;
  const ops = [];
  writableFor(role).forEach(col => {
    const cur = new Map(book[col].filter(o => o && SAFE_ID.test(o.id)).map(o => [o.id, o]));
    cur.forEach((o, id) => { const j = stable(o); if (synced[col].get(id) !== j) ops.push({col, id, j}); });
    synced[col].forEach((_, id) => { if (!cur.has(id)) ops.push({col, id, del:true}); });
  });
  let bizJ = canManage() ? stable(bizFromBook()) : null;
  if (bizJ === syncedBiz) bizJ = null;
  if (!ops.length && !bizJ) return;
  const chunks = [];
  for (let i = 0; i < ops.length; i += 200) chunks.push(ops.slice(i, i + 200));
  if (!chunks.length) chunks.push([]);
  chunks.forEach((chunk, ci) => {
    const batch = FB.writeBatch(FB.db);
    chunk.forEach(op => {
      const r = FB.doc(FB.db, 'businesses', bizId, op.col, op.id);
      if (op.del) batch.delete(r); else batch.set(r, JSON.parse(op.j));
    });
    if (ci === 0 && bizJ) batch.update(FB.doc(FB.db, 'businesses', bizId), JSON.parse(bizJ));
    // Mark as synced right away: Firestore applies the write to its local copy immediately,
    // so later edits (even offline) are compared against it instead of waiting for the server.
    chunk.forEach(op => { if (op.del) synced[op.col].delete(op.id); else synced[op.col].set(op.id, op.j); });
    if (ci === 0 && bizJ) syncedBiz = bizJ;
    pendingWrites++; showSaveState();
    batch.commit().then(() => { pendingWrites--; showSaveState(); }).catch(e => {
      pendingWrites--; showSaveState();
      toast(e && e.code === 'permission-denied' ? 'Not saved: your role can’t make that change' : 'Couldn’t save some changes. Check your connection');
    });
  });
}

// Redraw for changes from other devices, but never while someone is typing in the page.
function scheduleRender(){
  const a = document.activeElement;
  if (a && $('#app').contains(a) && a.matches('input,select,textarea')){ pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', e => {
  if (!pendingRender || !$('#app').contains(e.target)) return;
  setTimeout(() => { const a = document.activeElement; if (!(a && $('#app').contains(a) && a.matches('input,select,textarea'))){ pendingRender = false; render(); } }, 0);
});

function cleanIn(col, id, data){
  if (!SAFE_ID.test(id)) return null;
  const o = {...data, id};
  ['unitId', 'stayId'].forEach(k => { if (k in o) o[k] = cleanRef(o[k]); });
  if (col === 'stays' && o.type === 'monthly' && !/^\d{4}-\d{2}$/.test(o.trackFrom || '')) o.trackFrom = monthOf(o.start) > THIS_MONTH ? monthOf(o.start) : THIS_MONTH;
  return o;
}
function markReady(k){
  ready.add(k);
  if (!loaded && [...need].every(x => ready.has(x))){ loaded = true; gate = ''; showSaveState(); render(); }
}
function stopTeam(){ teamUnsubs.forEach(u => { try { u(); } catch(e){} }); teamUnsubs = []; team = {members:[], invites:[]}; }
function stopData(){ dataUnsubs.forEach(u => { try { u(); } catch(e){} }); dataUnsubs = []; stopTeam(); }
function stopSync(){ unsubs.forEach(u => { try { u(); } catch(e){} }); unsubs = []; stopData(); }

function syncError(e){
  if (e && e.code === 'permission-denied'){ stopSync(); gate = 'removed'; render(); return; }
  stopSync(); gate = 'error'; gateMsg = 'Lost the connection to your records. Check your internet, then tap Try again.'; render();
}

function subscribeData(){
  stopData();
  SYNC_COLS.forEach(c => { book[c] = []; synced[c] = new Map(); });
  colsFor(role).forEach(col => {
    need.add(col);
    dataUnsubs.push(FB.onSnapshot(FB.collection(FB.db, 'businesses', bizId, col), snap => {
      snap.docChanges().forEach(ch => {
        const id = ch.doc.id;
        if (ch.type === 'removed'){ synced[col].delete(id); book[col] = book[col].filter(x => x.id !== id); return; }
        const raw = ch.doc.data(), o = cleanIn(col, id, raw);
        if (!o) return;
        synced[col].set(id, stable({...raw, id}));
        const i = book[col].findIndex(x => x.id === id);
        if (i >= 0) book[col][i] = o; else book[col].push(o);
      });
      markReady(col);
      if (loaded) scheduleRender();
    }, e => { if (colsFor(role).includes(col)) syncError(e); }));
  });
  if (role === 'owner'){
    teamUnsubs.push(FB.onSnapshot(FB.collection(FB.db, 'businesses', bizId, 'members'), snap => {
      team.members = snap.docs.map(d => ({id:d.id, ...d.data()})); refreshTeam();
    }, () => {}));
    teamUnsubs.push(FB.onSnapshot(FB.collection(FB.db, 'businesses', bizId, 'invites'), snap => {
      team.invites = snap.docs.map(d => ({email:d.id, ...d.data()})); refreshTeam();
    }, () => {}));
  }
}

function startSync(){
  stopSync();
  book = blank(); role = ''; syncedBiz = ''; loaded = false; gate = 'boot';
  SYNC_COLS.forEach(c => synced[c] = new Map());
  need = new Set(['me', 'biz']); ready = new Set();
  render();
  unsubs.push(FB.onSnapshot(FB.doc(FB.db, 'businesses', bizId, 'members', fbUser.uid), snap => {
    if (!snap.exists()){ stopSync(); gate = 'removed'; render(); return; }
    const r = snap.data().role;
    if (!ROLE_NAMES[r]){ syncError({code:'permission-denied'}); return; }
    if (r !== role){
      role = r;
      document.body.classList.toggle('maint', role === 'maintenance');
      subscribeData();
      if (loaded){ toast(`Your role is now ${ROLE_NAMES[role]}`); render(); }
    }
    markReady('me');
  }, syncError));
  unsubs.push(FB.onSnapshot(FB.doc(FB.db, 'businesses', bizId), snap => {
    if (!snap.exists()){ syncError({code:'permission-denied'}); return; }
    const d = snap.data();
    book.business = typeof d.name === 'string' ? d.name : '';
    book.elecRate = Number(d.elecRate) || 0;
    book.waterRate = Number(d.waterRate) || 0;
    book.reminderLang = d.reminderLang === 'tl' ? 'tl' : 'en';
    book.lastBackup = typeof d.lastBackup === 'string' ? d.lastBackup : '';
    syncedBiz = stable(bizFromBook());
    markReady('biz');
    if (loaded) scheduleRender();
  }, syncError));
}

async function enterAs(user){
  gate = 'boot'; gateMsg = ''; render();
  try {
    const email = String(user.email || '').toLowerCase();
    const uref = FB.doc(FB.db, 'users', user.uid);
    const us = await FB.getDoc(uref);
    let biz = us.exists() && SAFE_ID.test(us.data().bizId || '') ? us.data().bizId : '';
    if (biz){
      const ms = await FB.getDoc(FB.doc(FB.db, 'businesses', biz, 'members', user.uid));
      if (!ms.exists()) biz = '';
    }
    if (!biz && email){
      const inv = await FB.getDoc(FB.doc(FB.db, 'invites', email));
      if (inv.exists() && SAFE_ID.test(inv.data().bizId || '') && (inv.data().role === 'manager' || inv.data().role === 'maintenance')){
        const b = inv.data().bizId, r = inv.data().role;
        // Joining is one batch: the rules check the invite still exists while it is being used up.
        const batch = FB.writeBatch(FB.db);
        batch.set(FB.doc(FB.db, 'businesses', b, 'members', user.uid), {role:r, email, name:user.displayName || '', joinedAt:FB.serverTimestamp()});
        batch.set(uref, {bizId:b});
        batch.delete(FB.doc(FB.db, 'invites', email));
        batch.delete(FB.doc(FB.db, 'businesses', b, 'invites', email));
        await batch.commit();
        biz = b;
      }
    }
    if (!biz){ gate = 'setup'; render(); return; }
    if (!us.exists() || us.data().bizId !== biz) await FB.setDoc(uref, {bizId:biz});
    bizId = biz;
    startSync();
  } catch(e){
    gate = 'error';
    gateMsg = e && e.code === 'permission-denied' ? 'This account isn’t allowed in yet. Ask the owner to invite it, then tap Try again.' : 'Couldn’t connect. Check your internet connection, then tap Try again.';
    render();
  }
}

async function createBusiness(name){
  const btn = $('#createBizForm button'); if (btn) btn.disabled = true;
  try {
    const b = newId();
    await FB.setDoc(FB.doc(FB.db, 'businesses', b), {name, ownerUid:fbUser.uid, elecRate:0, waterRate:0, reminderLang:'en', lastBackup:'', createdAt:FB.serverTimestamp()});
    const batch = FB.writeBatch(FB.db);
    batch.set(FB.doc(FB.db, 'businesses', b, 'members', fbUser.uid), {role:'owner', email:String(fbUser.email || '').toLowerCase(), name:fbUser.displayName || '', joinedAt:FB.serverTimestamp()});
    batch.set(FB.doc(FB.db, 'users', fbUser.uid), {bizId:b});
    await batch.commit();
    bizId = b;
    startSync();
  } catch(e){
    if (btn) btn.disabled = false;
    toast('Couldn’t create the business. Check your connection and try again');
  }
}

function authError(e){
  const c = (e && e.code) || '';
  if (c === 'auth/unauthorized-domain') return 'This website address isn’t allowed to sign in yet. In Firebase, add it under Authentication, Settings, Authorized domains.';
  if (c === 'auth/network-request-failed') return 'No internet connection. Connect and try again.';
  return 'Sign-in didn’t finish. Please try again.' + (c ? ` (${c})` : '');
}
async function signIn(){
  const p = new FB.GoogleAuthProvider();
  p.setCustomParameters({prompt:'select_account'});
  try { await FB.signInWithPopup(FB.auth, p); }
  catch(e){
    if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-environment')){
      try { await FB.signInWithRedirect(FB.auth, p); } catch(e2){ gateMsg = authError(e2); render(); }
    } else if (!(e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request'))){
      gateMsg = authError(e); render();
    }
  }
}
// Signing out also erases this phone's offline copy, so the next person using the device can't see the records.
async function signOutAll(){
  stopSync();
  try { await FB.signOut(FB.auth); } catch(e){}
  try { await FB.terminate(FB.db); await FB.clearIndexedDbPersistence(FB.db); } catch(e){}
  location.reload();
}

function waitForFirebase(){
  return new Promise((res, rej) => {
    if (window.FB) return res(window.FB);
    const t = setTimeout(() => rej(new Error('timeout')), 20000);
    window.addEventListener('fb-ready', () => { clearTimeout(t); res(window.FB); }, {once:true});
  });
}
async function start(){
  render();
  try { FB = await waitForFirebase(); }
  catch(e){ gate = 'error'; gateMsg = 'Couldn’t load the app. Check your internet connection, then reload the page.'; render(); return; }
  FB.getRedirectResult(FB.auth).catch(e => { gateMsg = authError(e); if (gate === 'signin') render(); });
  FB.onAuthStateChanged(FB.auth, user => {
    fbUser = user;
    if (!user){ stopSync(); bizId = ''; role = ''; gate = 'signin'; render(); return; }
    enterAs(user);
  });
}

/* ---------- Family access (owner only) ---------- */
function refreshTeam(){ if (teamOpen && dlg.open) teamDialog(); }
function teamDialog(){
  teamOpen = true;
  const link = location.origin + location.pathname;
  const people = team.members.slice().sort((a, b) => (a.role === 'owner' ? -1 : b.role === 'owner' ? 1 : byName(a.email, b.email))).map(m => `
    <div class="item"><div class="main"><div class="title">${esc(m.name || m.email)}</div><div class="sub">${esc(m.email)}</div></div>
      ${m.id === fbUser.uid ? '<span class="pill">Owner (you)</span>' : `<select class="role-select" data-uid="${esc(m.id)}" aria-label="Role for ${esc(m.email)}">
        ${['manager', 'maintenance'].map(r => `<option value="${r}" ${m.role === r ? 'selected' : ''}>${ROLE_NAMES[r]}</option>`).join('')}</select>
        <button type="button" class="btn small quiet danger" data-act="remove-member" data-id="${esc(m.id)}">Remove</button>`}</div>`).join('');
  const invites = team.invites.map(i => `
    <div class="item"><div class="main"><div class="title">${esc(i.email)}</div><div class="sub">Invited as ${esc(ROLE_NAMES[i.role] || i.role)}, hasn’t signed in yet</div></div>
      <button type="button" class="btn small quiet danger" data-act="cancel-invite" data-id="${esc(i.email)}">Cancel invite</button></div>`).join('');
  openDialog(`<form class="dlg" id="inviteForm"><h2>Family access</h2>
    <p class="note"><strong>Manager:</strong> everything except family access and Start over. <strong>Maintenance:</strong> only units and repairs, never tenants or payments.</p>
    <div class="list">${people}${invites}</div>
    <h3 style="font-size:1.05rem;margin-top:6px">Invite someone</h3>
    <label>Their Google email<input name="email" type="email" required autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="name@gmail.com"></label>
    <label>Role<select name="role"><option value="manager">Manager</option><option value="maintenance">Maintenance</option></select></label>
    <p class="note">After inviting, send them this link and ask them to sign in with that exact Google account: <strong>${esc(link)}</strong></p>
    <div class="foot"><button type="button" class="btn quiet" data-act="close">Close</button>
      <button type="button" class="btn" data-act="copy-link">Copy link</button>
      <button class="btn primary">Send invite</button></div></form>`, d => { sendInvite(d); return false; }, true);
}
async function sendInvite(d){
  const email = String(d.email || '').trim().toLowerCase(), r = d.role === 'maintenance' ? 'maintenance' : 'manager';
  if (!/^[^\s@/]+@[^\s@/]+\.[^\s@/]+$/.test(email)){ toast('Enter a valid email address'); return; }
  if (team.members.some(m => m.email === email)){ toast('That person already has access'); return; }
  try {
    const batch = FB.writeBatch(FB.db);
    batch.set(FB.doc(FB.db, 'invites', email), {bizId, role:r, invitedBy:fbUser.uid, createdAt:FB.serverTimestamp()});
    batch.set(FB.doc(FB.db, 'businesses', bizId, 'invites', email), {role:r, createdAt:FB.serverTimestamp()});
    await batch.commit();
    toast(`Invited ${email}. Send them the link`);
  } catch(e){
    toast(e && e.code === 'permission-denied' ? 'That email already has an invite from another business' : 'Couldn’t send the invite. Check your connection');
  }
}
async function cancelInvite(email){
  try {
    const batch = FB.writeBatch(FB.db);
    batch.delete(FB.doc(FB.db, 'invites', email));
    batch.delete(FB.doc(FB.db, 'businesses', bizId, 'invites', email));
    await batch.commit();
  } catch(e){ toast('Couldn’t cancel the invite'); }
}

/* ---------- rent and utility logic ---------- */
const unitById = id => book.units.find(u => u.id === id);
const stayById = id => book.stays.find(s => s.id === id);
function isActive(s){
  if (s.ended) return false;
  if (s.type === 'daily' && s.end && s.end < TODAY) return false;
  return true;
}
const activeStay = unitId => book.stays.find(s => s.unitId === unitId && isActive(s));
// A monthly tenant is billed for month k if they had moved in by the end of that month
// and had not moved out before that month's due date.
function stayActiveIn(s, k){
  if (s.type !== 'monthly') return false;
  if (s.start > monthEnd(k)) return false;
  if (s.ended && s.ended < ymd(dueDate(s, k))) return false;
  return true;
}
// If two tenants overlap in one month (move-out and move-in), utilities go to the newer one only.
const monthlyStayIn = (unitId, k) => book.stays.filter(s => s.unitId === unitId && stayActiveIn(s, k))
  .sort((a, b) => String(b.start).localeCompare(String(a.start)))[0];
function paidFor(stay, period){
  return sum(book.payments.filter(p => p.stayId === stay.id && (stay.type === 'daily' || p.period === period)), p => p.amount);
}
const readingFor = (unitId, k) => book.readings.find(r => r.unitId === unitId && r.period === k);
function prevFor(unitId, k){
  const r = book.readings.filter(x => x.unitId === unitId && x.period < k).sort((a, b) => b.period.localeCompare(a.period))[0];
  return r ? {elec: r.elecCur, water: r.waterCur} : null;
}
const isNum = v => typeof v === 'number' && isFinite(v);
function utilOf(r){
  const out = {kwh:0, m3:0, elec:0, water:0};
  if (!r) return out;
  if (isNum(r.elecPrev) && isNum(r.elecCur)){ out.kwh = round2(Math.max(0, r.elecCur - r.elecPrev)); out.elec = round2(out.kwh * (r.elecRate || 0)); }
  if (isNum(r.waterPrev) && isNum(r.waterCur)){ out.m3 = round2(Math.max(0, r.waterCur - r.waterPrev)); out.water = round2(out.m3 * (r.waterRate || 0)); }
  return out;
}
function bill(stay, k){
  const rent = Number(stay.rent || 0);
  const ownsUtil = stay.type === 'monthly' && (monthlyStayIn(stay.unitId, k) || {}).id === stay.id;
  const u = ownsUtil ? utilOf(readingFor(stay.unitId, k)) : utilOf(null);
  return {rent, ...u, total: round2(rent + u.elec + u.water)};
}
function dueDate(stay, k){
  const base = parseD(k + '-01');
  const dim = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
  const d = new Date(base.getFullYear(), base.getMonth(), Math.min(Number(stay.dueDay) || 1, dim));
  // First month: rent can't be due before the tenant moves in.
  if (stay.start && monthOf(stay.start) === k){ const st = parseD(stay.start); if (d < st) return st; }
  return d;
}
// Unpaid amounts from months before this one, counted from when tracking began.
function arrears(s){
  const out = {total:0, months:[]};
  if (s.type !== 'monthly') return out;
  let k = s.trackFrom && s.trackFrom > monthOf(s.start) ? s.trackFrom : monthOf(s.start);
  for (let guard = 0; k < THIS_MONTH && guard < 240; guard++, k = addMonths(k, 1)){
    if (!stayActiveIn(s, k)) continue;
    const owed = round2(bill(s, k).total - paidFor(s, k));
    if (owed > 0.004){ out.months.push({k, owed}); out.total = round2(out.total + owed); }
  }
  return out;
}
function status(stay){
  if (stay.type === 'daily'){
    const paid = paidFor(stay), left = round2(Math.max(0, Number(stay.rent || 0) - paid));
    if (left <= 0) return {key:'daily', label: isActive(stay) ? `Guest until ${shortDate(stay.end)}` : 'Paid', left, paid};
    return {key:'over', label:`${peso(left)} unpaid`, left, paid};
  }
  const b = bill(stay, THIS_MONTH), billedNow = stayActiveIn(stay, THIS_MONTH);
  const paid = paidFor(stay, THIS_MONTH);
  const leftNow = billedNow ? round2(Math.max(0, b.total - paid)) : 0;
  const ar = arrears(stay), left = round2(leftNow + ar.total);
  const due = dueDate(stay, THIS_MONTH);
  const days = Math.round((due - today) / 86400000);
  const base = {left, leftNow, paid, due, days, b, billedNow, ar};
  if (left <= 0) return {...base, key:'paid', label:'Paid'};
  if (ar.total > 0) return {...base, key:'over', label:`${peso(left)} overdue`};
  if (!billedNow) return {...base, key:'upcoming', label:'Nothing due'};
  const part = paid > 0 ? `${peso(left)} left, ` : '';
  if (days < 0) return {...base, key:'over', label:`${peso(left)} overdue`};
  if (days <= 5) return {...base, key:'soon', label: part + (days === 0 ? 'due today' : `due ${shortDate(due)}`)};
  if (stay.start > TODAY) return {...base, key:'upcoming', label:`Moves in ${shortDate(stay.start)}`};
  return {...base, key:'upcoming', label: part + `due ${shortDate(due)}`};
}
// Former tenants and checked-out guests who still owe money.

function ordinal(n){ n = Number(n) || 1; const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

function overview(){
  if (!book.units.length) return emptyState();
  let collected = sum(book.payments.filter(p => String(p.date).startsWith(THIS_MONTH)), p => p.amount);
  let toCollect = 0, overdue = 0, vacant = 0, billed = 0, paidBills = 0;
  const rows = book.units.map(u => {
    const s = activeStay(u.id);
    if (!s){ vacant++; return {u}; }
    const st = status(s);
    toCollect += st.left;
    if (st.key === 'over') overdue++;
    if (s.type === 'monthly' && st.billedNow){ billed += st.b.total; paidBills += Math.min(st.paid, st.b.total); }
    return {u, s, st};
  });
  const pct = billed ? Math.round(paidBills / billed * 100) : 0;
  const rowById = new Map(rows.map(r => [r.u.id, r]));
  const tile = r => {
    const key = searchKey(r.u, r.s);
    if (!r.s) return `<button class="door vacant" data-act="unit" data-id="${r.u.id}" data-search="${key}"><span class="num">${esc(r.u.name)}</span><span class="st">Vacant</span></button>`;
    return `<button class="door ${r.st.key}" data-act="unit" data-id="${r.u.id}" data-search="${key}"><span class="num">${esc(r.u.name)}</span><span class="who">${esc(first(r.s.name))}</span><span class="st">${esc(r.st.label)}</span></button>`;
  };
  const groups = groupedUnits(), heads = groups.some(g => g.name);
  const tiles = groups.map(g => `<section class="grp">${heads ? grpHead(g) : ''}<div class="board">${g.units.map(u => tile(rowById.get(u.id))).join('')}</div></section>`).join('');
  const attention = rows.filter(r => r.s && (r.st.key === 'over' || r.st.key === 'soon'))
    .sort((a, b) => (a.st.key === 'over' ? 0 : 1) - (b.st.key === 'over' ? 0 : 1) || (a.st.days ?? 0) - (b.st.days ?? 0));
  const past = pastOwing().map(s => ({s, st: status(s)}));
  past.forEach(p => { toCollect += p.st.left; overdue++; });
  const openRepairs = book.repairs.filter(r => !r.done).length;
  const parts = [`<strong>${peso(collected)}</strong> received this month`];
  if (toCollect) parts.push(`<strong>${peso(toCollect)}</strong> still to collect`);
  if (overdue) parts.push(`<strong>${overdue}</strong> overdue`);
  if (vacant) parts.push(`<strong>${vacant}</strong> vacant`);
  const bdays = book.lastBackup ? Math.floor((Date.now() - new Date(book.lastBackup)) / 86400000) : null;
  const nudge = dlMode && (bdays === null || bdays >= 30)
    ? `<div class="callout"><span>${bdays === null ? 'Your data hasn’t been backed up yet.' : `Your last backup was ${bdays} days ago.`} Download a copy so nothing gets lost.</span><button class="btn small primary" data-act="backup">Download backup</button></div>` : '';
  return `${nudge}<div class="section-head"><div><h2>${esc(monthName(THIS_MONTH))}</h2>
      <p class="lede">${parts.join(', ')}.</p>
      ${billed ? `<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Monthly bills collected"><span style="width:${pct}%"></span></div>
      <p class="progress-label">${pct}% of this month’s ${peso(billed)} in rent and utilities collected</p>` : ''}</div>
      <button class="btn primary" data-act="pay">Record payment</button></div>
    ${searchBar()}${tiles}
    <div class="legend">
      <span style="--c:var(--paid)">Paid</span><span style="--c:var(--soon)">Due within 5 days</span>
      <span style="--c:var(--over)">Overdue or unpaid</span><span style="--c:var(--daily)">Daily guest, paid</span>
      <span style="--c:var(--line)">Not due yet or vacant</span></div>
    <h3 class="group">Needs follow-up</h3>
    ${attention.length || past.length ? `<div class="list">${attention.map(r => `
      <div class="item"><div class="main"><div class="title">${esc(r.s.name)} <span class="pill ${r.st.key}">${esc(r.st.key === 'over' ? 'Overdue' : 'Due soon')}</span></div>
      <div class="sub">${esc(r.u.name)}, ${esc(r.st.label)}${r.st.ar && r.st.ar.total ? `, including ${esc(peso(r.st.ar.total))} from ${esc(r.st.ar.months.map(m => monthShort(m.k)).join(', '))}` : ''}</div></div>
      <div class="row-actions"><button class="btn small" data-act="remind" data-id="${r.s.id}">Write reminder</button>
      <button class="btn small primary" data-act="pay" data-id="${r.s.id}">Record payment</button></div></div>`).join('')}${past.map(p => `
      <div class="item"><div class="main"><div class="title">${esc(p.s.name)} <span class="pill over">${p.s.type === 'daily' ? 'Checked out' : 'Moved out'}</span></div>
      <div class="sub">${esc(unitLabel(p.s.unitId))}, ${esc(peso(p.st.left))} unpaid</div></div>
      <div class="row-actions"><button class="btn small" data-act="remind" data-id="${p.s.id}">Write reminder</button>
      <button class="btn small primary" data-act="pay" data-id="${p.s.id}">Record payment</button></div></div>`).join('')}</div>`
      : `<p class="lede">Nobody is overdue or due in the next 5 days.</p>`}

}

function reports(){
  if (!book.payments.length && !book.stays.length) return `<div class="section-head"><div><h2>Reports</h2></div></div>` + emptyState();
  const months = Array.from({length:12}, (_, i) => addMonths(THIS_MONTH, i - 11));
  const data = months.map(k => {
    let billed = 0, paidM = 0;
    book.stays.forEach(s => { if (stayActiveIn(s, k)){ const b = bill(s, k); billed += b.total; paidM += Math.min(paidFor(s, k), b.total); } });
    const daily = sum(book.payments.filter(p => String(p.date).startsWith(k) && (stayById(p.stayId) || {}).type === 'daily'), p => p.amount);
    const util = sum(book.readings.filter(r => r.period === k), r => { const x = utilOf(r); return x.elec + x.water; });
    return {k, billed: round2(billed), paidM: round2(paidM), daily, util: round2(util)};
  });
  const tBilled = sum(data, d => d.billed), tPaid = sum(data, d => d.paidM), tDaily = sum(data, d => d.daily);
  const rate = tBilled ? Math.round(tPaid / tBilled * 100) : 0;
  const since = months[0] + '-01';
  const yearPays = book.payments.filter(p => p.date >= since);
  const methods = METHODS.map(m => [m, sum(yearPays.filter(p => p.method === m), p => p.amount)]);
  const mMax = Math.max(1, ...methods.map(x => x[1]));
  return `<div class="section-head"><div><h2>Reports</h2>
      <p class="lede">Last 12 months: <strong>${peso(tPaid + tDaily)}</strong> collected. Monthly tenants paid <strong>${rate}%</strong> of the ${peso(tBilled)} billed, and daily guests brought in <strong>${peso(tDaily)}</strong>.</p></div>${dlMode ? '<button class="btn" data-act="export">Export to Excel</button>' : ''}</div>
    <div class="card">${chartSvg(data)}
      <div class="chart-legend"><span><i style="background:var(--chart-a)"></i>Monthly tenants paid</span><span><i style="background:var(--daily)"></i>Daily guests</span><span><i style="background:transparent;border-top:2px dashed var(--ink);border-radius:0;height:0"></i>Billed to monthly tenants</span></div></div>
    <h3 class="group">Month by month</h3>
    <div class="scroll"><table class="prev"><thead><tr><th>Month</th><th class="num">Billed</th><th class="num">Utilities in bill</th><th class="num">Collected</th><th class="num">Rate</th><th class="num">Daily guests</th></tr></thead><tbody>
      ${data.slice().reverse().map(d => `<tr><td>${esc(monthName(d.k))}</td><td class="num">${peso(d.billed)}</td><td class="num">${peso(d.util)}</td><td class="num">${peso(d.paidM)}</td><td class="num">${d.billed ? Math.round(d.paidM / d.billed * 100) + '%' : ''}</td><td class="num">${peso(d.daily)}</td></tr>`).join('')}
    </tbody></table></div>
    <h3 class="group">How tenants pay</h3>
    <div class="card">${methods.map(([m, v]) => `<div class="mbar"><span>${esc(m)}</span><span class="track"><i style="width:${v / mMax * 100}%"></i></span><span class="amt">${peso(v)}</span></div>`).join('')}</div>`;
}

function chartSvg(data){
  const narrow = phoneQuery.matches;
  const W = narrow ? 400 : 720, H = narrow ? 240 : 260, L = 52, R = 8, T = 12, B = 28;
  const top = Math.max(1, ...data.map(d => Math.max(d.billed, d.paidM + d.daily)));
  const p = Math.pow(10, Math.floor(Math.log10(top)));
  const max = Math.ceil(top / p) * p;
  const y = v => T + (H - T - B) * (1 - v / max);
  const slot = (W - L - R) / data.length, bw = slot * 0.58;
  const fmt = v => v >= 1000 ? '₱' + (Math.round(v / 100) / 10) + 'k' : '₱' + v;
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = max * i / 4; g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; }
  const bars = data.map((d, i) => {
    const x = L + slot * i + (slot - bw) / 2;
    const tip = `${monthName(d.k)}: ${peso(d.paidM)} paid of ${peso(d.billed)} billed, ${peso(d.daily)} from daily guests`;
    return `<g><title>${esc(tip)}</title>
      <rect class="c-a" x="${x}" y="${y(d.paidM)}" width="${bw}" height="${y(0) - y(d.paidM)}" rx="3"/>
      <rect class="c-d" x="${x}" y="${y(d.paidM + d.daily)}" width="${bw}" height="${y(d.paidM) - y(d.paidM + d.daily)}" rx="3"/>
      ${d.billed ? `<line class="exp" x1="${x - 4}" x2="${x + bw + 4}" y1="${y(d.billed)}" y2="${y(d.billed)}"/>` : ''}
      <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(monthShort(d.k))}</text></g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rent and utilities billed and collected over the last 12 months">${g}${bars}</svg>`;
}

function reminderText(s, lang){
  const u = {name: unitLabel(s.unitId)}, st = status(s), f = first(s.name), tl = lang === 'tl';
  const biz = book.business || (tl ? 'ang may-ari' : 'your landlord');
  const pay = tl ? 'Puwede pong magbayad via GCash, Maya, bank transfer, o cash.' : 'You can pay via GCash, Maya, bank transfer, or cash.';
  const ref = tl ? 'Pakisend na lang po ang reference number pagkabayad.' : 'Please send your reference number once paid.';
  const thanks = `Salamat po! (${biz})`;
  // Daily guests and anyone who has already left: one simple balance message.
  if (s.type === 'daily' || !isActive(s)) return tl
    ? `Hi ${f}! Paalala lang po na may natitira pang balance na ${peso(st.left)} para sa stay ninyo sa ${u.name}. ${pay} ${thanks}`
    : `Hi ${f}! Friendly reminder that there’s a remaining balance of ${peso(st.left)} for your stay at ${u.name}. ${pay} ${thanks}`;
  const mo = monthName(THIS_MONTH), due = shortDate(st.due);
  // Case 1: unpaid earlier months.
  if (st.ar.total){
    const from = st.ar.months.map(m => monthShort(m.k)).join(', ');
    if (!st.leftNow) return tl
      ? `Hi ${f}! Paalala lang po na may hindi pa nababayarang ${peso(st.ar.total)} para sa ${u.name} mula ${from}. ${pay} ${ref} ${thanks}`
      : `Hi ${f}! Friendly reminder that ${peso(st.ar.total)} for ${u.name} is still unpaid from ${from}. ${pay} ${ref} ${thanks}`;
    const now = st.days < 0 ? (tl ? `lagpas na sa due date (${due})` : `was due on ${due}`) : (tl ? `due sa ${due}` : `is due on ${due}`);
    return tl
      ? `Hi ${f}! Paalala lang po na may hindi pa nababayarang ${peso(st.ar.total)} para sa ${u.name} mula ${from}, at ang bayad para sa ${mo} na ${peso(st.leftNow)} ay ${now}. Kabuuang balance: ${peso(st.left)}. ${pay} ${ref} ${thanks}`
      : `Hi ${f}! Friendly reminder that ${peso(st.ar.total)} for ${u.name} is still unpaid from ${from}, and your ${mo} bill of ${peso(st.leftNow)} ${now}. Total balance: ${peso(st.left)}. ${pay} ${ref} ${thanks}`;
  }
  const b = st.b, parts = [tl ? `upa ${peso(b.rent)}` : `rent ${peso(b.rent)}`];
  if (b.elec) parts.push(tl ? `kuryente ${peso(b.elec)} (${b.kwh} kWh)` : `electricity ${peso(b.elec)} (${b.kwh} kWh)`);
  if (b.water) parts.push(tl ? `tubig ${peso(b.water)} (${b.m3} m³)` : `water ${peso(b.water)} (${b.m3} m³)`);
  const bd = parts.length > 1 && !st.paid ? (tl ? ` Kasama na po rito ang ${parts.join(', ')}.` : ` This covers ${parts.join(', ')}.`) : '';
  // Case 2: this month's bill is past due.
  if (st.days < 0) return tl
    ? `Hi ${f}! Paalala lang po na lagpas na sa due date (${due}) ang bayad para sa ${u.name} (${mo}). Natitirang balance: ${peso(st.left)}.${bd} ${pay} ${ref} ${thanks}`
    : `Hi ${f}! Friendly reminder that your bill for ${u.name} (${mo}) was due on ${due}. Remaining balance: ${peso(st.left)}.${bd} ${pay} ${ref} ${thanks}`;
  // Case 3: coming due.
  return tl
    ? `Hi ${f}! Paalala lang po na ang bayad para sa ${u.name} (${mo}) na ${peso(st.left)} ay due sa ${due}.${bd} ${pay} ${thanks}`
    : `Hi ${f}! Just a heads up that your bill for ${u.name} (${mo}) of ${peso(st.left)} is due on ${due}.${bd} ${pay} ${thanks}`;
}

async function downloadBackup(){
  const slug = (book.business || 'rentals').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'rentals';
  const filename = `paupahan-backup-${slug}-${TODAY}.json`;
  const data = JSON.stringify({app:'paupahan', version:1, exportedAt:new Date().toISOString(), book}, null, 2);
  try {
    if (dlMode === 'cap') await downloads.save({filename, data});
    else if (dlMode === 'anchor'){
      const url = URL.createObjectURL(new Blob([data], {type:'application/json'}));
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } else { toast('Backups can’t be downloaded in this view'); return; }
    book.lastBackup = new Date().toISOString();
    commit('Backup saved. Keep it somewhere safe, like Google Drive');
  } catch(e){
    const c = e && e.code;
    toast(c === 'declined' ? 'Backup cancelled' : c === 'rate_limited' ? 'A save is already open. Try again in a moment' : 'Couldn’t save the backup. Try again');
  }
}

async function saveFile(filename, data, mime){
  try {
    if (dlMode === 'cap'){ await downloads.save({filename, data}); return true; }
    if (dlMode === 'anchor'){
      const url = URL.createObjectURL(new Blob([data], {type:mime}));
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return true;
    }
    toast('Files can’t be downloaded in this view'); return false;
  } catch(e){
    const c = e && e.code;
    toast(c === 'declined' ? 'Download cancelled' : c === 'rate_limited' ? 'A save is already open. Try again in a moment'
      : c === 'extension_not_enabled' ? 'Excel downloads aren’t available here. The backup file still works' : 'Couldn’t save the file. Try again');
    return false;
  }
}

async function exportExcel(){

    return [p.date, s ? unitName(s.unitId) : '', s ? s.name : 'Former tenant', Number(p.amount) || 0, p.method || '', p.ref || '', s && s.type === 'monthly' ? p.period || '' : ''];
  });
  const billsRows = book.readings.slice().sort((a, b) => b.period.localeCompare(a.period) || byUnit(unitName(a.unitId), unitName(b.unitId))).map(r => {
    const x = utilOf(r), s = monthlyStayIn(r.unitId, r.period), n = v => isNum(v) ? v : '';
    return [r.period, unitName(r.unitId), s ? s.name : '', n(r.elecPrev), n(r.elecCur), x.kwh, r.elecRate || 0, x.elec, n(r.waterPrev), n(r.waterCur), x.m3, r.waterRate || 0, x.water, round2(x.elec + x.water)];
  });

    const daily = sum(book.payments.filter(p => String(p.date).startsWith(k) && (stayById(p.stayId) || {}).type === 'daily'), p => p.amount);
    const util = sum(book.readings.filter(r => r.period === k), r => { const x = utilOf(r); return x.elec + x.water; });
    return [k, round2(billed), round2(util), round2(paid), billed ? Math.round(paid / billed * 1000) / 1000 : '', round2(daily)];
  });

  const wb = XLSX.utils.book_new();

const FIELDS = [
  ['unit', 'Unit or room', /unit|room|kwarto|apt|apartment|door/i, true],
  ['group', 'Building or floor', /building|bldg|floor|block|wing|palapag/i],

  ['start', 'Start or check-in date', /start|check.?in|move.?in|from|arriv|date/i],
  ['end', 'End or check-out date', /end|check.?out|until|depart/i],
];
let imp = null;
function importDialog(){
  if (!window.XLSX){ toast('The Excel reader didn’t load. Check your connection and try again'); return; }
  imp = null;
  openDialog(`<form class="dlg" id="impForm"><h2>Import from Excel</h2>
    <p class="note">Choose your bookings file (.xlsx, .xls, or .csv). You’ll match its columns and see a preview before anything is added.</p>

function loadSheet(){
  const rows = XLSX.utils.sheet_to_json(imp.wb.Sheets[imp.sheet], {header:1, raw:true, defval:''});
  const hi = rows.findIndex(r => r.filter(c => String(c).trim() !== '').length >= 2);
  imp.header = hi < 0 ? [] : rows[hi].map((c, i) => String(c).trim() || `Column ${i + 1}`);
  imp.rows = hi < 0 ? [] : rows.slice(hi + 1).filter(r => r.some(c => String(c).trim() !== ''));
  const used = new Set(); imp.map = {};
  FIELDS.forEach(([k, , re]) => { const i = imp.header.findIndex((h, j) => !used.has(j) && re.test(h)); if (i >= 0){ imp.map[k] = i; used.add(i); } });
  drawStep();
}
function drawStep(){
  const opts = sel => '<option value="">Not in my file</option>' + imp.header.map((h, i) => `<option value="${i}" ${sel === i ? 'selected' : ''}>${esc(h)}</option>`).join('');
  const parsed = imp.rows.map(parseRow).filter(Boolean);
  $('#impStep').innerHTML = `
    ${imp.wb.SheetNames.length > 1 ? `<label>Sheet<select id="impSheet">${imp.wb.SheetNames.map(n => `<option ${n === imp.sheet ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></label>` : ''}
    ${imp.header.length ? `<p class="note">Match your columns. Only the unit column is required. Rows with no name become vacant units.</p>
    <div class="two">${FIELDS.map(([k, label, , req]) => `<label>${label}${req ? ' (required)' : ''}<select data-map="${k}">${opts(imp.map[k])}</select></label>`).join('')}</div>
    <p class="note"><strong>${parsed.length}</strong> of ${imp.rows.length} rows ready. Check that the first few look right:</p>
    <div class="scroll"><table class="prev"><thead><tr><th>Unit</th><th>Name</th><th>Type</th><th>Rent</th><th>Due</th><th>Start</th><th>End</th></tr></thead><tbody>
    ${parsed.slice(0, 5).map(r => `<tr><td>${esc(r.unit)}</td><td>${esc(r.name || 'Vacant')}</td><td>${r.name ? (r.type === 'daily' ? 'Daily' : 'Monthly') : ''}</td><td>${r.rent ? peso(r.rent) : ''}</td><td>${r.name && r.type === 'monthly' ? ordinal(r.dueDay) : ''}</td><td>${r.name ? esc(shortDate(r.start)) : ''}</td><td>${r.endRaw ? esc(shortDate(r.endRaw)) : ''}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="note">This sheet looks empty. Pick another sheet or file.</p>'}`;
  const s = $('#impSheet'); if (s) s.addEventListener('change', () => { imp.sheet = s.value; loadSheet(); });
  $('#impStep').querySelectorAll('[data-map]').forEach(el => el.addEventListener('change', () => {
    if (el.value === '') delete imp.map[el.dataset.map]; else imp.map[el.dataset.map] = Number(el.value);
    drawStep();
  }));
}
function cell(r, k){ const i = imp.map[k]; return i === undefined ? '' : r[i]; }
function toDate(v){
  if (v === '' || v == null) return '';
  if (v instanceof Date) return isNaN(v) ? '' : ymd(new Date(v.getTime() + 43200000));
  if (typeof v === 'number' && v > 20000 && v < 80000){ const d = new Date(Math.round((v - 25569) * 86400000)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/); if (m) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad(m[1])}-${pad(m[2])}`;
  const t = Date.parse(s); return isNaN(t) ? '' : ymd(new Date(t));
}
function fixPhone(v){
  if (typeof v !== 'number') return String(v ?? '').trim();
  const d = String(Math.round(v));
  return /^9\d{9}$/.test(d) ? '0' + d : /^639\d{9}$/.test(d) ? '+' + d : d;
}
function parseRow(r){
  const unit = String(cell(r, 'unit')).trim(); if (!unit) return null;
  const name = String(cell(r, 'name')).trim();
  const rent = Number(String(cell(r, 'rent')).replace(/[^0-9.]/g, '')) || 0;
  const start = toDate(cell(r, 'start')) || TODAY;
  const endRaw = toDate(cell(r, 'end'));
  const type = /daily|day|transient|night|araw|short/i.test(String(cell(r, 'type'))) ? 'daily' : 'monthly';
  const dv = cell(r, 'dueDay');
  let dueDay;
  if (dv instanceof Date || (typeof dv === 'number' && dv > 31)){ const d = toDate(dv); dueDay = d ? parseD(d).getDate() : NaN; }
  else dueDay = parseInt(String(dv).replace(/[^0-9]/g, ''), 10);
  if (!(dueDay >= 1 && dueDay <= 31)) dueDay = parseD(start).getDate();
  return {unit, name, rent, start, endRaw, end: type === 'daily' ? (endRaw || start) : '', type, dueDay, phone: fixPhone(cell(r, 'phone')), group: String(cell(r, 'group')).trim()};
}
function runImport(){
  if (!imp || !imp.rows){ toast('Choose a file first'); return false; }
  if (imp.map.unit === undefined){ toast('Pick which column has the unit'); return false; }
  const parsed = imp.rows.map(parseRow).filter(Boolean);
  if (!parsed.length){ toast('No rows with a unit to import'); return false; }
  let nu = 0, ns = 0, skip = 0;
  parsed.forEach(r => {
    let u = book.units.find(x => x.name.toLowerCase() === r.unit.toLowerCase());
    if (!u){ u = {id:newId(), name:r.unit, rate: r.type === 'monthly' ? r.rent : 0, group:r.group}; book.units.push(u); nu++; }
    else if (!u.group && r.group) u.group = r.group;
    else if (!u.rate && r.type === 'monthly' && r.rent) u.rate = r.rent;
    if (!r.name) return;
    const s = {id:newId(), unitId:u.id, type:r.type, name:r.name, phone:r.phone, start:r.start, end:r.end, dueDay:r.dueDay, rent:r.rent, deposit:0,
      trackFrom: monthOf(r.start) > THIS_MONTH ? monthOf(r.start) : THIS_MONTH};
    if (r.type === 'monthly' && r.endRaw && r.endRaw < TODAY) s.ended = r.endRaw;
    const dup = book.stays.some(x => x.unitId === u.id && x.name.toLowerCase() === s.name.toLowerCase() && x.start === s.start);
    if (dup || (isActive(s) && activeStay(u.id))){ skip++; return; }
    book.stays.push(s); ns++;
  });
  commit(`Added ${nu} unit${nu === 1 ? '' : 's'} and ${ns} tenant${ns === 1 ? '' : 's'}${skip ? `. Skipped ${skip} already in the app or in an occupied unit` : ''}`);
}

  const names = [['Maria Santos', 5500, 5], ['Jun dela Cruz', 5500, 1], ['Liza Reyes', 6000, 15], ['Mark Villanueva', 4800, 10], null, ['Grace Mendoza', 6000, 20], null, ['Paolo Garcia', 4800, 3]];

  names.forEach((n, i) => {
    const u = {id:newId(), name:'Unit ' + (i + 1), rate: n ? n[1] : 5000, group: i < 4 ? 'Old building' : 'New building'};
    book.units.push(u);

    months.forEach(k => {
      const de = n ? Math.round(55 + rnd() * 90) : Math.round(rnd() * 8), dw = n ? Math.round(3 + rnd() * 7) : 0;
      book.readings.push({id:newId(), unitId:u.id, period:k, elecPrev:e, elecCur:e + de, waterPrev:w, waterCur:w + dw, elecRate:book.elecRate, waterRate:book.waterRate});

    months.forEach(k => {
      const total = bill(s, k).total;
      const dd = dueDate(s, k); dd.setDate(dd.getDate() + Math.floor(rnd() * 4));
      const method = METHODS[rnd() < 0.55 ? 0 : rnd() < 0.5 ? 1 : rnd() < 0.5 ? 2 : 3];

    });
  });
  [4, 6].forEach(ui => months.slice(0, 11).forEach(k => {

    const st = parseD(k + '-' + pad(5 + Math.floor(rnd() * 18))), nights = 1 + Math.floor(rnd() * 4), en = new Date(st); en.setDate(en.getDate() + nights);
    const gs = {id:newId(), unitId:book.units[ui].id, type:'daily', name:'Guest ' + k.slice(5), phone:'', start:ymd(st), end:ymd(en), dueDay:1, rent:nights * 1200, deposit:0};
    book.stays.push(gs);
    book.payments.push({id:newId(), stayId:gs.id, amount:gs.rent, date:ymd(st), method:rnd() < 0.7 ? 'GCash' : 'Cash', ref:'', period:k});
  }));
  const g = book.units[6], end = new Date(today); end.setDate(end.getDate() + 2);
  const gs = {id:newId(), unitId:g.id, type:'daily', name:'Ana Bautista', phone:'', start:TODAY, end:ymd(end), dueDay:1, rent:2400, deposit:0};

  book.repairs.push({id:newId(), unitId:book.units[1].id, issue:'Aircon not cooling', date:TODAY, done:false});

    case 'retry': if (fbUser) enterAs(fbUser); else location.reload(); break;
    case 'team': go(teamDialog); break;
    case 'copy-link': { const l = location.origin + location.pathname; if (navigator.clipboard) navigator.clipboard.writeText(l).then(() => toast('Link copied'), () => toast(l)); else toast(l); break; }
    case 'cancel-invite': cancelInvite(id); break;
    case 'remove-member': { const m = team.members.find(x => x.id === id); if (!m) break;
      if (!confirm(`Remove ${m.email}? They will immediately lose access on every device.`)) break;
      FB.deleteDoc(FB.doc(FB.db, 'businesses', bizId, 'members', id)).catch(() => toast('Couldn’t remove them. Check your connection')); break; }
    case 'import': go(importDialog); break;
    case 'copy': {
      const t = $('#remText'); t.select();
      const done = () => toast('Copied. Paste it into Messenger or SMS');
      const fallback = () => { try { document.execCommand('copy'); done(); } catch(_) { toast('Select the text and copy it'); } };
      if (navigator.clipboard) navigator.clipboard.writeText(t.value).then(done, fallback); else fallback();
      break; }
    case 'moveout': { const s = stayById(id); go(() => confirmDialog(`${s.type === 'daily' ? 'Check out' : 'Move out'} ${s.name}?`, 'Yes, mark as left', () => { s.ended = TODAY; commit('Unit is now vacant'); })); break; }
    case 'del-unit': { const u = unitById(id); go(() => confirmDialog(`Delete ${u.name}?`, 'Delete unit', () => {
      book.units = book.units.filter(x => x.id !== id);
      book.stays.forEach(s => { if (s.unitId === id && !s.ended) s.ended = TODAY; });
      commit('Unit deleted'); })); break; }
    case 'del-pay': go(() => removeWithUndo('payments', id, 'Payment deleted')); break;
    case 'del-reading': go(() => removeWithUndo('readings', id, 'Readings cleared')); break;
    case 'fixed': { const r = book.repairs.find(x => x.id === id); r.done = true; r.doneDate = TODAY; commit('Marked fixed'); break; }
    case 'reopen': { const r = book.repairs.find(x => x.id === id); r.done = false; commit('Reopened'); break; }
    case 'del-repair': removeWithUndo('repairs', id, 'Repair deleted'); break;
  }
});
document.addEventListener('input', e => { if (e.target.id === 'q'){ searchQ = e.target.value; applySearch(); } });
document.addEventListener('change', e => {
  if (e.target.classList.contains('role-select')){
    const uid = e.target.dataset.uid, r = e.target.value;
    if (r === 'manager' || r === 'maintenance') FB.setDoc(FB.doc(FB.db, 'businesses', bizId, 'members', uid), {role:r}, {merge:true})
      .then(() => toast('Role updated'), () => toast('Couldn’t change the role'));
    return;
  }
  if (e.target.id === 'payMonth' && e.target.value){ payMonth = e.target.value; render(); }
  if (e.target.id === 'billMonth' && e.target.value){ billMonth = e.target.value; render(); }
  if (e.target.id === 'restoreFile'){ const f = e.target.files[0]; closeDialog(); restoreFrom(f); }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'createBizForm'){
    e.preventDefault();
    const name = String(new FormData(e.target).get('name') || '').trim();
    if (name) createBusiness(name);
    return;
  }
  if (e.target.id === 'repairForm'){
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    book.repairs.push({id:newId(), unitId:d.unitId, issue:d.issue.trim(), date:TODAY, done:false});
    commit('Repair added');
  } else if (e.target.classList.contains('meter')){
    e.preventDefault();
    saveReading(e.target);
  }
});
window.addEventListener('hashchange', () => {
  searchQ = '';
  render();
  if (location.hash === '#repairs'){ const el = document.getElementById('repairs'); if (el) el.scrollIntoView(); }
  else window.scrollTo(0, 0);
});

let tt;
function toast(m, action){
  const t = $('#toast');
  t.textContent = '';
  const span = document.createElement('span'); span.textContent = m; t.appendChild(span);
  t.classList.toggle('has-action', !!action);
  if (action){
    const b = document.createElement('button'); b.type = 'button'; b.className = 'toast-btn'; b.textContent = action.label;
    b.addEventListener('click', () => { clearTimeout(tt); t.classList.remove('show', 'has-action'); action.run(); });
    t.appendChild(b);
  }
  t.classList.add('show'); clearTimeout(tt);
  tt = setTimeout(() => t.classList.remove('show', 'has-action'), action ? 7000 : 2400 + m.length * 30);
}
// Delete right away, but keep the item so one tap can put it back in the same place.
function removeWithUndo(key, id, msg){
  const i = book[key].findIndex(x => x.id === id);
  if (i < 0) return;
  const [item] = book[key].splice(i, 1);
  commit();
  toast(msg, {label:'Undo', run: () => { book[key].splice(Math.min(i, book[key].length), 0, item); commit('Restored'); }});
}

/* ---------- light / dark toggle ---------- */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const themeBtn = $('#themeBtn');
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
function effTheme(){ return document.documentElement.dataset.theme || (darkQuery.matches ? 'dark' : 'light'); }
function syncThemeBtn(){
  const dark = effTheme() === 'dark';
  themeBtn.innerHTML = dark ? SUN + '<span>Light</span>' : MOON + '<span>Dark</span>';
  themeBtn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
}
themeBtn.addEventListener('click', () => {
  const next = effTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('paupahan-theme', next); } catch(e){}
  syncThemeBtn();
});
if (darkQuery.addEventListener) darkQuery.addEventListener('change', syncThemeBtn);
if (phoneQuery.addEventListener) phoneQuery.addEventListener('change', () => { if (currentView() === 'reports') render(); });
syncThemeBtn();

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const oldDay = TODAY, oldMonth = THIS_MONTH;
  setToday();
  if (TODAY === oldDay) return;
  if (payMonth === oldMonth) payMonth = THIS_MONTH;
  if (billMonth === oldMonth) billMonth = THIS_MONTH;
  render();
});

start();
})();
</script>
